<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Tournament Draft: draft five tournament players, highest points per game wins.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Tournament Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky scoreboard header + tabbed working views; player detail slides in from the right */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E4E8EF; --ink:#14203A; --muted:#5A6479; --line:#D5DBE5;
  --accent:#D4541C; --accent-soft:#FBE6DB; --accent-ink:#FFFFFF;
  --good:#1D7F47; --good-soft:#DDF2E5; --bad:#C2271F; --bad-soft:#FBE1DF; --warn:#9A6A00;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono:"DM Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px; --bar:#14203A; --bar-ink:#EEF1F5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C121D; --surface:#141C2A; --sunk:#1B2536; --ink:#E6EBF3; --muted:#93A0B6; --line:#26324A;
  --accent:#F0743A; --accent-soft:#3A2116; --accent-ink:#140A04;
  --good:#46C47E; --good-soft:#15301F; --bad:#FF6259; --bad-soft:#3A1715; --warn:#E3B341; --bar:#1C273B; --bar-ink:#E6EBF3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C121D; --surface:#141C2A; --sunk:#1B2536; --ink:#E6EBF3; --muted:#93A0B6; --line:#26324A;
  --accent:#F0743A; --accent-soft:#3A2116; --accent-ink:#140A04;
  --good:#46C47E; --good-soft:#15301F; --bad:#FF6259; --bad-soft:#3A1715; --warn:#E3B341; --bar:#1C273B; --bar-ink:#E6EBF3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance;text-transform:uppercase}
h2{font-size:30px} h3{font-size:20px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.03em;text-transform:uppercase}
.ball{width:18px;height:18px;border-radius:50%;background:var(--accent);position:relative;overflow:hidden;flex:none}
.ball::before,.ball::after{content:"";position:absolute;inset:0;border:1.5px solid rgba(0,0,0,.45);border-radius:50%}
.ball::before{transform:scaleX(.45)} .ball::after{border-width:0;border-top:1.5px solid rgba(0,0,0,.45);top:50%;border-radius:0}
.league-name{font-size:13px;opacity:.75}
.role{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.role select{background:transparent;border:1px solid color-mix(in srgb,var(--bar-ink) 35%,transparent);border-radius:6px;padding:4px 8px;color:var(--bar-ink)}
.role select option{color:#14203A;background:#fff}
nav.tabs{width:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px 11px;color:var(--bar-ink);opacity:.62;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{opacity:.9}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--accent)}
.badge-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}
.sample{font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sample b{color:var(--warn);font-weight:600}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.head .grow{flex:1;min-width:240px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px}
.field input,.field select,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.seed{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
th.sort{cursor:pointer} th.sort:hover{color:var(--ink)} th.on{color:var(--accent)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.taken td{opacity:.42}
.pname{font-weight:600}
.rank{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--muted);width:44px}
.star{background:none;border:0;cursor:pointer;font-size:17px;line-height:1;color:var(--line);padding:2px}
.star.on{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.filters .inp{flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* draft room */
.clock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--bar);color:var(--bar-ink);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.clock .who{font-family:var(--f-display);font-weight:800;font-size:40px;text-transform:uppercase;line-height:1}
.clock .meta{font-size:13px;opacity:.75;margin-top:4px}
.timer{font-family:var(--f-mono);font-size:46px;font-weight:500;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right;line-height:1}
.timer.over{color:var(--bad);animation:pulse 1s infinite}
.timer.off{font-size:16px;opacity:.6}
.upnext{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.upnext span{font-size:12px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--bar-ink) 14%,transparent)}
.rosters{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.roster{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.roster.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.roster h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between}
.slot{font-size:13px;padding:3px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.slot:first-of-type{border-top:0}
.slot .e{color:var(--muted);opacity:.6}
.order{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.order div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:center;background:var(--surface)}
.order b{font-family:var(--f-display);font-size:22px;color:var(--accent);min-width:1.4em}
.order .pending{opacity:.4}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}

/* standings */
.stand td{vertical-align:top}
.avg{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.mini{font-size:12.5px;color:var(--muted);white-space:normal;min-width:260px}
.mini span{display:inline-block;margin-right:10px}
.mini .out{text-decoration:line-through;opacity:.6}
.crown{color:var(--accent);font-weight:700}
.results{display:flex;flex-direction:column}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.res .w{font-weight:700}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;overflow-y:auto;border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px));animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer .x{float:right}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.tile{background:var(--sunk);border-radius:8px;padding:9px 10px}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.05}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .bar{fill:var(--accent)} .chart .ref{stroke:var(--muted);stroke-dasharray:3 3} .chart .grid{stroke:var(--line)}
.chart .lab{fill:var(--ink);font-size:11px}
.sec{margin-top:18px}
.sec h3{margin-bottom:8px}

/* sign in */
.signin{max-width:400px;margin:30px auto;text-align:left}
.signin h2{font-size:36px;margin-bottom:6px}

.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--sunk);border-radius:8px;padding:14px;font-weight:600}
.formula .eq{font-family:var(--f-display);font-size:24px;color:var(--accent)}
.frac{display:inline-flex;flex-direction:column;text-align:center;min-width:0}
.frac span:first-child{border-bottom:2px solid var(--ink);padding-bottom:3px}.frac span:last-child{padding-top:3px}
.ex{padding:12px 0;border-top:1px solid var(--line)}.ex:first-of-type{border-top:0;padding-top:0}
.extab td,.extab th{padding:4px 8px;font-size:13.5px}.extab tr.tot td{font-weight:700;border-bottom:0}
.calc{font-size:13.5px;color:var(--muted);text-align:right;margin-top:4px}.calc b{color:var(--ink)}
.rules{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:10px 18px;margin:0}
.rules dt{font-weight:700}.rules dd{margin:0;color:var(--muted);max-width:70ch}
@media (max-width:600px){.rules{grid-template-columns:minmax(0,1fr)}.rules dd{margin-bottom:6px}}
.inj{color:var(--bad);font-weight:800;margin-left:2px;cursor:help}
h2 .inj{font-size:.8em;vertical-align:super}
.injbox{margin-top:10px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:14px}
.injbox .muted{color:var(--bad);opacity:.8}
.ap{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--accent)}
.wl{display:inline-block;min-width:18px;text-align:center;border-radius:4px;font-weight:700;font-size:11.5px;padding:0 3px}
.wl.w{background:var(--good-soft);color:var(--good)}.wl.l{background:var(--bad-soft);color:var(--bad)}
.by{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:2px 4px;border-radius:4px;background:var(--sunk);color:var(--muted);margin-left:5px;cursor:help}
.drawer .extab td,.drawer .extab th{padding:5px 5px;font-size:13px}
.drawer .extab td:nth-child(2){white-space:normal}
.trsum{font-size:12.5px;padding:8px 12px 0}
.clock .meta{max-width:60ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 0 4px 10px;margin:10px 0}
.stack{display:flex;flex-direction:column;gap:14px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.sub{display:none;font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.sortsel{display:none;flex:0 1 auto!important}
@media (max-width:600px){
  .hm{display:none}.sub{display:block}.sortsel{display:block}
  td,th{padding:8px 6px}.rank{width:30px;font-size:16px}
  .brand{font-size:20px}.role{font-size:12px}.top-in{padding-top:8px}
  nav.tabs button{font-size:15px;padding:8px 11px 9px}
  .stand .mini{min-width:140px}.stand .mini span{display:block;margin:0 0 2px}
  h2{font-size:26px}.clock{grid-template-columns:1fr}.clock .who{font-size:32px}.timer{text-align:left}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.league-name{display:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="top-in">
    <div class="brand"><span class="ball" aria-hidden="true"></span>The Tournament Draft</div>
    <div class="league-name" id="leagueName"></div>
    <label class="role" for="roleSel">Viewing as
      <select id="roleSel">
        <option value="commish">Commissioner</option>
        <option value="member">Troy (member)</option>
      </select>
    </label>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main id="view"></main>
<div id="drawerHost"></div>
<div id="toastHost"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(2027);
const pickR=(arr,rng=R)=>arr[Math.floor(rng()*arr.length)];
const gauss=rng=>{let u=0,v=0;while(!u)u=rng();while(!v)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const shuffle=(a,rng=Math.random)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const f2=n=>(Math.round(n*100)/100).toFixed(2);
let toastT;function toast(msg){const h=$("#toastHost");h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>h.innerHTML="",2600)}

/* ---------- sample data ---------- */
const REGIONS=["East","West","South","Midwest"];
const SCHOOLS=["Houston","Auburn","Duke","Florida","Alabama","Tennessee","St. John's","Michigan State","Texas Tech","Iowa State","Wisconsin","Kentucky","Arizona","Maryland","Purdue","Texas A&M","Clemson","Oregon","Michigan","Memphis","BYU","Ole Miss","Missouri","Illinois","Saint Mary's","UCLA","Kansas","Gonzaga","Louisville","Marquette","Creighton","UConn","Baylor","Mississippi State","Georgia","Oklahoma","Vanderbilt","Arkansas","New Mexico","Utah State","VCU","Drake","Colorado State","McNeese","Liberty","UC San Diego","Yale","Akron","Grand Canyon","High Point","Lipscomb","Troy","Wofford","UNC Wilmington","Montana","Robert Morris","Bryant","Omaha","Norfolk State","SIU Edwardsville","Mount St. Mary's","Alabama State","American","Saint Francis"];
const FIRST=["Jalen","Marcus","Tyler","Isaiah","Caleb","Devin","Cam","Elijah","Jordan","Trey","Malik","Brody","Keegan","Dante","Owen","Xavier","Amari","Reed","Darius","Nate","Quentin","Silas","Terrence","Ayo","Mason","Luka","Rashad","Colby","Andre","Micah"];
const LAST=["Harper","Ellison","Brooks","Whitfield","Okafor","Lindqvist","Carver","Duvall","Mensah","Pryor","Holloway","Sutton","Vance","Ruiz","Kowalski","Bishop","Tate","Abernathy","Quinn","Fofana","Navarro","Pruitt","Langford","Coleman","Reyes","Grady","Osei","Whitaker","Bell","Moreau"];
const teams=SCHOOLS.map((name,i)=>({id:i,name,seed:Math.floor(i/4)+1,region:REGIONS[i%4],ff:false,alive:true}));
[41,43,60,62].forEach(i=>teams[i].ff=true); // First Four teams: excluded entirely
const CONF={"Houston":"Big 12","Auburn":"SEC","Duke":"ACC","Florida":"SEC","Alabama":"SEC","Tennessee":"SEC","St. John's":"Big East","Michigan State":"Big Ten","Texas Tech":"Big 12","Iowa State":"Big 12","Wisconsin":"Big Ten","Kentucky":"SEC","Arizona":"Big 12","Maryland":"Big Ten","Purdue":"Big Ten","Texas A&M":"SEC","Clemson":"ACC","Oregon":"Big Ten","Michigan":"Big Ten","Memphis":"American","BYU":"Big 12","Ole Miss":"SEC","Missouri":"SEC","Illinois":"Big Ten","Saint Mary's":"WCC","UCLA":"Big Ten","Kansas":"Big 12","Gonzaga":"Pac-12","Louisville":"ACC","Marquette":"Big East","Creighton":"Big East","UConn":"Big East","Baylor":"Big 12","Mississippi State":"SEC","Georgia":"SEC","Oklahoma":"SEC","Vanderbilt":"SEC","Arkansas":"SEC","New Mexico":"Mountain West","Utah State":"Pac-12","VCU":"Atlantic 10","Drake":"Missouri Valley","Colorado State":"Pac-12","McNeese":"Southland","Liberty":"Conference USA","UC San Diego":"Big West","Yale":"Ivy League","Akron":"MAC","Grand Canyon":"Mountain West","High Point":"Big South","Lipscomb":"ASUN","Troy":"Sun Belt","Wofford":"SoCon","UNC Wilmington":"CAA","Montana":"Big Sky","Robert Morris":"Horizon","Bryant":"America East","Omaha":"Summit","Norfolk State":"MEAC","SIU Edwardsville":"OVC","Mount St. Mary's":"MAAC","Alabama State":"SWAC","American":"Patriot","Saint Francis":"NEC"};
teams.forEach(t=>t.conf=CONF[t.name]||"Independent");
teams.slice(0,34).map(t=>({t,k:t.id+R()*12})).sort((a,b)=>a.k-b.k).slice(0,25).forEach((x,i)=>x.t.ap=i+1);
const apTag=t=>t.ap?`<span class="ap">#${t.ap}</span> `:"";
const POS=["G","G","G","F","F","F","C"],CLS=["Fr","So","Jr","Sr","Gr"];
const used=new Set();
function mkName(){let n;do{n=pickR(FIRST)+" "+pickR(LAST)}while(used.has(n));used.add(n);return n}
function ht(pos){const b=pos==="G"?73:pos==="F"?78:82,r=pos==="C"?4:5,i=b+Math.floor(R()*r);return `${Math.floor(i/12)}-${i%12}`}
const players=[];
teams.forEach(t=>{
  [13+R()*9.5,9+R()*6,6.5+R()*5].forEach(base=>{
    const pos=pickR(POS),ppg=Math.round(base*10)/10,gp=29+Math.floor(R()*5);
    players.push({id:players.length,name:mkName(),team:t.id,pos,cls:pickR(CLS),ht:ht(pos),gp,ppg,
      rpg:pos==="C"?6+R()*5:pos==="F"?4+R()*4:2+R()*3, apg:pos==="G"?2.5+R()*4:0.6+R()*2.2,
      mpg:24+R()*12, fg:(pos==="C"?47:41)+R()*12, tp:pos==="C"?18+R()*16:30+R()*12, ft:64+R()*24,
      log:Array.from({length:5},()=>Math.max(0,Math.round(ppg+gauss(R)*5.5))),
      tPts:0,tGp:0,tLog:[]});
  });
});
const team=p=>teams[p.team];
// sample injury report

/* draft engine */
function sequence(){
  const d=S.draft,seq=[];
  for(let r=1;r<=d.settings.rounds;r++){
    let ord;
    if(r<=d.settings.snake) ord=r%2?d.order:d.order.slice().reverse();
    else ord=d.randOrders[r]||(d.randOrders[r]=shuffle(d.order));
    ord.forEach(m=>seq.push({round:r,member:m,random:r>d.settings.snake}));
  }
  return seq;
}
function rosterOf(m){
  let ids=S.draft.picks.filter(p=>p.member===m).map(p=>p.player);
  S.swaps.filter(s=>s.member===m).forEach(s=>{ids=ids.map(x=>x===s.out?s.in:x)});

}
function ownerMap(){const o={};MEMBERS.forEach(m=>rosterOf(m.id).forEach(id=>o[id]=m.id));return o}

function bestAvailable(){const o=ownerMap();return players.filter(p=>eligible(p)&&o[p.id]===undefined).sort((a,b)=>b.ppg-a.ppg)[0]}

const ROUNDS=["Round of 64","Round of 32","Sweet 16","Elite Eight","Final Four","Championship"];
const DAYS=[["Thu","Fri"],["Sat","Sun"],["Thu","Fri"],["Sat","Sun"],["Sat"],["Mon"]];
function nextLabel(){const T=S.T;return `${ROUNDS[T.round]} · ${DAYS[T.round][T.day]}`}
function simDay(){
  const T=S.T;if(T.done)return;
  const games=T.field.length/2,days=DAYS[T.round].length,per=Math.ceil(games/days);
  const from=T.day*per,to=Math.min(games,from+per);
  for(let g=from;g<to;g++){
    const a=teams[T.field[2*g]],b=teams[T.field[2*g+1]];
    const pA=1/(1+Math.exp(-(b.seed-a.seed)*0.17));
    const w=Math.random()<pA?a:b,l=w===a?b:a;
    const score=t=>{let s=0;players.filter(p=>p.team===t.id).forEach(p=>{const pts=Math.max(0,Math.round(p.ppg+gauss(Math.random)*6));p.tPts+=pts;p.tGp++;p.tLog.push({round:ROUNDS[T.round],opp:(t===a?b:a).name,pts});s+=pts});return s+32+Math.floor(Math.random()*20)};
    let sw=score(w),sl=score(l);if(sl>=sw)sl=sw-1-Math.floor(Math.random()*9);
    l.alive=false;T.next[g]=w.id;
    T.results.unshift({label:nextLabel(),w:w.id,l:l.id,sw,sl});
  }
  const label=nextLabel();
  if(T.day<days-1)T.day++;
  else{T.field=T.next;T.next=[];T.round++;T.day=0;if(T.field.length===1){T.done=true;T.champ=T.field[0]}}
  toast(`${label} results are in`);render();
}

function gameNight(){
  const day=++S.tracker.day,out=[];let games=0;
  teams.forEach(t=>{
    if(!t.upcoming.length||t.upcoming[0].day>day)return;
    const g=t.upcoming.shift(),o=teams[g.opp];games++;
    t.recent=[...t.recent.slice(1),{day,opp:o.id,home:g.home,...result(t,o,Math.random)}];
    t.upcoming.push({day:(t.upcoming.length?t.upcoming[t.upcoming.length-1].day:day)+2+Math.floor(Math.random()*3),opp:pickOpp(t,Math.random).id,home:Math.random()<.5});

      const pts=Math.max(0,Math.round(p.ppg+gauss(Math.random)*6)),reb=Math.max(0,Math.round(p.rpg+gauss(Math.random)*2.5)),ast=Math.max(0,Math.round(p.apg+gauss(Math.random)*1.8));
      p.ppg=(p.ppg*p.gp+pts)/(p.gp+1);p.rpg=(p.rpg*p.gp+reb)/(p.gp+1);p.apg=(p.apg*p.gp+ast)/(p.gp+1);p.gp++;
      p.log=[...p.log.slice(1),pts];p.glog=[...p.glog.slice(1),{pts,reb,ast}];out.push({id:p.id,pts});
    });
  });
  S.tracker.lastNight=out.sort((a,b)=>b.pts-a.pts).slice(0,6);S.tracker.lastDate=dstr(day);
  toast(`Stats updated for ${dstr(day)}: ${games} teams played`);render();
}

    </div>
    <div class="tiles">
      ${[["PPG",f1(p.ppg)],["RPG",f1(p.rpg)],["APG",f1(p.apg)],["MPG",f1(p.mpg)],["FG%",f1(p.fg)],["3P%",f1(p.tp)],["FT%",f1(p.ft)],["GP",p.gp]].map(([k,v])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}
    </div>
    <div class="row">
      <button class="btn ${S.watch.has(id)?"":"primary"}" data-star="${id}">${S.watch.has(id)?"Remove from watchlist":"Add to watchlist"}</button>
      ${S.role==="commish"?`<button class="btn" data-act="toggleInj" data-id="${id}">${p.inj?"Clear injury":"Mark injured"}</button>`:""}
      ${canDraft?`<button class="btn primary" data-draft="${id}">Draft for ${esc(MEMBERS[c.member].name)}</button>`:""}
    </div>
    <div class="sec"><h3>Last 5 games</h3><p class="muted" style="margin:0 0 6px;font-size:13px">Points per game. Dashed line is the season average.</p>${chart}
      <div class="tw" style="margin-top:8px"><table class="extab"><thead><tr><th>Date</th><th>Opponent</th><th>Result</th><th class="r">PTS</th><th class="r">REB</th><th class="r">AST</th></tr></thead><tbody>
      ${t.recent.map((g,i)=>({g,s:p.glog[i]})).reverse().map(({g,s})=>`<tr><td class="muted">${dstr(g.day)}</td><td>${g.home?"vs":"@"} ${apTag(teams[g.opp])}${esc(teams[g.opp].name)}</td><td><span class="wl ${g.w?"w":"l"}">${g.w?"W":"L"}</span> <span class="num">${g.us}-${g.them}</span></td><td class="r num"><b>${s.pts}</b></td><td class="r num">${s.reb}</td><td class="r num">${s.ast}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div class="sec"><h3>Upcoming</h3>${t.upcoming.map(g=>`<div class="res"><span><span class="muted">${dstr(g.day)}</span> · ${g.home?"vs":"@"} ${apTag(teams[g.opp])}${esc(teams[g.opp].name)}</span><span class="muted">${teams[g.opp].conf===t.conf?"Conference":"Non-conference"}</span></div>`).join("")}</div>
    <div class="sec"><h3>Tournament</h3>${p.tGp?`<p style="margin:0 0 6px"><b class="num">${p.tPts}</b> pts in <b class="num">${p.tGp}</b> games · <b class="num">${f1(p.tPts/p.tGp)}</b> per game</p>
      ${p.tLog.map(g=>`<div class="res"><span>${g.round} vs ${esc(g.opp)}</span><span class="num">${g.pts} pts</span></div>`).join("")}`:`<p class="muted" style="margin:0">${t.ff?"Excluded: First Four games and teams don't count.":"No tournament games yet."}</p>`}</div>
  </aside>`;
}
function closeDrawer(){$("#drawerHost").innerHTML=""}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-tab],[data-act],[data-player],[data-star],[data-draft],[data-pos],[data-avail],[data-sort],[data-apos],[data-swap],[data-doswap],[data-scope],[data-tpos],[data-conf]");
  if(!el)return;
  const ds=el.dataset;
  if(ds.star!==undefined){e.stopPropagation();const id=+ds.star;S.watch.has(id)?S.watch.delete(id):S.watch.add(id);toast(S.watch.has(id)?`${players[id].name} added to watchlist`:`Removed from watchlist`);
    if($(".drawer"))openPlayer(id);if(S.tab==="board")fillBoard();else if(S.tab==="draft")fillAvail();else render();return}
  if(ds.draft!==undefined){e.stopPropagation();makePick(+ds.draft);return}
  if(ds.tab){e.preventDefault();S.tab=ds.tab;S.signinPreview=false;closeDrawer();render();window.scrollTo(0,0);return}
  if(ds.player!==undefined){e.preventDefault();openPlayer(+ds.player);return}
  if(ds.pos){S.board.pos=ds.pos;render();return}
  if(ds.avail){S.board.avail=ds.avail;render();return}
  if(ds.apos){S.apos=ds.apos;document.querySelectorAll("[data-apos]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.apos===ds.apos));fillAvail();return}
  if(ds.sort){const b=S.board;b.dir=b.sort===ds.sort?-b.dir:-1;b.sort=ds.sort;render();return}
  if(ds.scope){S.tr.scope=ds.scope;S.tr.n=50;render();return}
  if(ds.tpos){S.tr.pos=ds.tpos;S.tr.n=50;render();return}
  if(ds.conf){e.preventDefault();S.tr.conf=ds.conf;S.tr.scope="all";S.tr.n=50;render();window.scrollTo(0,0);return}
  if(ds.swap){const [m,p]=ds.swap.split(":").map(Number);S.swapUI={member:m,out:p};render();return}
  if(ds.doswap){const {member,out}=S.swapUI;S.swaps.push({member,out,in:+ds.doswap});toast(`${players[out].name} replaced by ${players[+ds.doswap].name}`);S.swapUI=null;render();return}
  const a=ds.act,d=S.draft;
  if(a==="close")closeDrawer();
  if(a==="signinPreview"){S.signinPreview=true;S.signinSent=false;render()}
  if(a==="signinBack"){S.signinPreview=false;render()}
  if(a==="undo"&&d.picks.length){const p=d.picks.pop();d.status="live";d.clockStart=Date.now();toast(`Undid ${players[p.player].name}`);render()}
  if(a==="autodraft"){if(d.status==="setup"||d.status==="drawing"){if(!d.order.length||d.status==="drawing")d.order=shuffle(MEMBERS.map(m=>m.id));d.reveal=MEMBERS.length;d.status="live"}while(d.status==="live"){const c=onClock(),b=bestAvailable();const pool=players.filter(p=>eligible(p)&&ownerMap()[p.id]===undefined).sort((x,y)=>y.ppg-x.ppg).slice(0,4);const choice=pool[Math.floor(Math.random()*pool.length)]||b;
      d.picks.push({round:c.round,overall:d.picks.length+1,member:c.member,player:choice.id});if(d.picks.length>=sequence().length)d.status="done"}toast("Draft complete. Teams are locked in.");render()}
  if(a==="resetDraft"){d.status="setup";d.picks=[];d.order=[];d.reveal=0;d.randOrders={};S.swaps=[];resetT();render()}
  if(a==="startDraft"&&d.status==="setup"){d.order=shuffle(MEMBERS.map(m=>m.id));d.randOrders={};d.reveal=0;d.status="drawing";render();
    const step=()=>{if(d.status!=="drawing")return;d.reveal++;if(d.reveal>=MEMBERS.length){render();setTimeout(()=>{if(d.status!=="drawing")return;d.status="live";d.clockStart=Date.now();toast(`Order drawn. ${MEMBERS[d.order[0]].name} is on the clock.`);render()},1100)}else{if(S.tab==="draft")render();setTimeout(step,200)}};
    setTimeout(step,300)}
  if(a==="simDay")simDay();
  if(a==="resetTourney"){resetT();render()}
  if(a==="cancelSwap"){S.swapUI=null;render()}
  if(a==="night")gameNight();
  if(a==="trMore"){S.tr.n+=50;fillTracker()}
  if(a==="toggleInj"){const p=players[+ds.id];p.inj=p.inj?null:{status:"Out",note:"Flagged by commissioner",updated:"Today"};toast(p.inj?`${p.name} marked injured`:`${p.name} cleared`);render();openPlayer(p.id)}
});
function resetT(){players.forEach(p=>{p.tPts=0;p.tGp=0;p.tLog=[]});teams.forEach(t=>t.alive=true);S.swaps=[];S.swapUI=null;initTourney()}
document.addEventListener("input",e=>{
  if(e.target.id==="bq"){S.board.q=e.target.value;fillBoard()}
  if(e.target.id==="aq")fillAvail();
  if(e.target.id==="tq"){S.tr.q=e.target.value;S.tr.n=50;fillTracker()}
});
document.addEventListener("change",e=>{
  const s=S.draft.settings,id=e.target.id;
  if(id==="sRounds"){s.rounds=Math.max(1,Math.min(8,+e.target.value||5));s.snake=Math.min(s.snake,s.rounds);S.draft.randOrders={};render()}
  if(id==="sSnake"){s.snake=Math.max(0,Math.min(s.rounds,+e.target.value||0));S.draft.randOrders={};render()}
  if(id==="sTimer"){s.timer=Math.max(0,+e.target.value||0)}
  if(id==="sHard"){s.hard=e.target.checked}
  if(id==="tconf"){S.tr.conf=e.target.value;S.tr.n=50;render()}
  if(id==="tstat"){S.tr.stat=e.target.value;render()}
  if(id==="bsort"){S.board.sort=e.target.value;S.board.dir=-1;render()}
  if(id==="roleSel"){S.role=e.target.value;S.swapUI=null;render()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="inviteForm"){const v=$("#invEmails").value.split(/[,\s]+/).filter(x=>/.+@.+\..+/.test(x));if(!v.length){toast("Enter at least one email address");return}
    S.league.invited.push(...v);toast(`Invites sent to ${v.length} ${v.length===1?"person":"people"}`);render()}
  if(e.target.id==="createForm"){const n=$("#cName").value.trim()||"New league";S.leagues.push({name:n,role:"Commissioner",size:1});toast(`${n} created. Share the invite link to add people.`);render()}
  if(e.target.id==="signinForm"){S.signinSent=true;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
render();
</script>

</body>
</html>
